<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudMart - Shop</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:0}
header{background:#071c4d;color:white;padding:15px 30px;display:flex;justify-content:space-between}
header h1{margin:0}
.container{padding:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:white;border-radius:8px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center}
.card h3{margin:10px 0}
.card .price{color:#f68b1e;font-weight:bold;font-size:18px}
button{background:#f68b1e;color:white;border:none;padding:10px 20px;border-radius:4px;cursor:pointer}
#status{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header><h1>CloudMart</h1><div>Cart (0)</div></header>
<div id="status">Loading products...</div>
<div class="container" id="products"></div>
<script>
async function loadProducts(){
  try {
    let res = await fetch('/api/products');
    if(!res.ok) res = await fetch('http://localhost:8001/products');
    const products = await res.json();
    document.getElementById('status').style.display='none';
    document.getElementById('products').innerHTML = products.map(p=>`
      <div class="card">
        <h3>${p.name}</h3>
        <p>ID: ${p.id}</p>
        <p class="price">$${p.price}</p>
        <button>Add to Cart</button>
      </div>
    `).join('');
  } catch(e){
    document.getElementById('status').innerHTML = 'Failed: '+e.message;
  }
}
loadProducts();
</script>
</body>
</html>
