prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    storageSpec: null
grafana:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  adminPassword: "admin123"
alertmanager:
  enabled: false
kubeStateMetrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
